# ==================== DATASOURCE (MySQL) ====================
# Ajuste username e password conforme o seu ambiente local
#spring.datasource.url=jdbc:mysql://localhost:3306/blogappdb?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Sao_Paulo
spring.datasource.url=jdbc:mysql://localhost/blogappdb?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&useLegacyDatetimeCode=false&serverTimezone=America/Sao_Paulo&SameSite=None
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ==================== JPA / HIBERNATE ====================
# update = cria/atualiza tabelas automaticamente (bom para desenvolvimento)
# Em produção use 'validate' ou 'none' + Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual-creation=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ==================== SERVER ====================
server.port=8080
# Descomente se a porta 8080 estiver ocupada:
# server.port=8081

# ==================== LOGGING (útil na aula) ====================
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# ==================== ENCODING ====================
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
